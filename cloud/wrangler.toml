# AiFi Executor dashboard — Cloudflare Worker + KV. Deployed by .github/workflows/deploy-dashboard.yml,
# which creates the KV namespace "aifi-executor" if missing and writes its id below at deploy time.
name = "aifi-executor-dashboard"
main = "worker.js"
compatibility_date = "2026-09-01"
workers_dev = true

[[kv_namespaces]]
binding = "EXEC"
id = "KV_NAMESPACE_ID"

# The front end: worker.js imports every ui/ module and stylesheet as text and joins them into one page
# script and one <style> (see ui/README.md). worker.js, design.js and mission.js stay ES modules.
[[rules]]
type = "Text"
globs = ["**/ui/*.js", "**/ui/*.css"]
fallthrough = false
