# Your tap. Run from the GitHub mobile app: Actions → approve → Run workflow, paste the proposal id, choose yes.
name: approve
on:
  workflow_dispatch:
    inputs:
      agent:
        description: "Which agent (core, or an id from agents/index.json)"
        required: true
        type: string
        default: "core"
      proposal_id:
        description: "Proposal id from the alert"
        required: true
        type: string
      confirm:
        description: "Execute this proposal?"
        required: true
        type: choice
        options: ["no", "yes"]
permissions:
  contents: write
concurrency:
  group: executor
  cancel-in-progress: false
jobs:
  approve:
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Which host runs cycles (config/host.json)
        id: host
        run: echo "host=$(python3 -c "import json;print(json.load(open('config/host.json')).get('host','github'))")" >> "$GITHUB_OUTPUT"
      - name: File the approval for the server (no order leaves GitHub)
        if: steps.host.outputs.host != 'github' && inputs.confirm == 'yes'
        env: { AGENT: "${{ inputs.agent }}", PID: "${{ inputs.proposal_id }}" }
        run: |
          mkdir -p state/requests
          python3 -c "import json,os,time; t=time.strftime('%Y%m%dT%H%M%SZ',time.gmtime()); json.dump({'action':'approve','agent':os.environ['AGENT'],'proposal_id':os.environ['PID'],'at':t}, open(f\"state/requests/{t}-approve-{os.environ['AGENT']}.json\",'w'))"
      - name: Python (a venv with the exchange SDK only when live mode is configured)
        id: py
        if: steps.host.outputs.host == 'github'
        run: |
          if grep -lq '"mode": *"live"' config/settings.json agents/*/settings.json 2>/dev/null; then
            python3 -m venv .venv && .venv/bin/pip install --quiet -r requirements-live.txt
            echo "bin=.venv/bin/python" >> "$GITHUB_OUTPUT"
          else
            echo "bin=python3" >> "$GITHUB_OUTPUT"
          fi
      - name: Execute the proposal
        if: steps.host.outputs.host == 'github'
        env:
          PROPOSAL_ID: ${{ inputs.proposal_id }}
          CONFIRM: ${{ inputs.confirm }}
          ALERT_WEBHOOK: ${{ secrets.ALERT_WEBHOOK }}
          HL_AGENT_KEY: ${{ secrets.HL_AGENT_KEY }}
          HL_ACCOUNT_ADDRESS: ${{ secrets.HL_ACCOUNT_ADDRESS }}
          HL_AGENT_KEY_WIDE_4H: ${{ secrets.HL_AGENT_KEY_WIDE_4H }}
          HL_ACCOUNT_ADDRESS_WIDE_4H: ${{ secrets.HL_ACCOUNT_ADDRESS_WIDE_4H }}
          HL_AGENT_KEY_FAST_1H: ${{ secrets.HL_AGENT_KEY_FAST_1H }}
          HL_ACCOUNT_ADDRESS_FAST_1H: ${{ secrets.HL_ACCOUNT_ADDRESS_FAST_1H }}
          HL_AGENT_KEY_TREND_1D: ${{ secrets.HL_AGENT_KEY_TREND_1D }}
          HL_ACCOUNT_ADDRESS_TREND_1D: ${{ secrets.HL_ACCOUNT_ADDRESS_TREND_1D }}
          HL_AGENT_KEY_CARRY_1H: ${{ secrets.HL_AGENT_KEY_CARRY_1H }}
          HL_ACCOUNT_ADDRESS_CARRY_1H: ${{ secrets.HL_ACCOUNT_ADDRESS_CARRY_1H }}
          HL_AGENT_KEY_ARENA_01: ${{ secrets.HL_AGENT_KEY_ARENA_01 }}
          HL_ACCOUNT_ADDRESS_ARENA_01: ${{ secrets.HL_ACCOUNT_ADDRESS_ARENA_01 }}
          HL_AGENT_KEY_ARENA_02: ${{ secrets.HL_AGENT_KEY_ARENA_02 }}
          HL_ACCOUNT_ADDRESS_ARENA_02: ${{ secrets.HL_ACCOUNT_ADDRESS_ARENA_02 }}
          HL_AGENT_KEY_ARENA_03: ${{ secrets.HL_AGENT_KEY_ARENA_03 }}
          HL_ACCOUNT_ADDRESS_ARENA_03: ${{ secrets.HL_ACCOUNT_ADDRESS_ARENA_03 }}
          HL_AGENT_KEY_ARENA_04: ${{ secrets.HL_AGENT_KEY_ARENA_04 }}
          HL_ACCOUNT_ADDRESS_ARENA_04: ${{ secrets.HL_ACCOUNT_ADDRESS_ARENA_04 }}
          HL_AGENT_KEY_ARENA_05: ${{ secrets.HL_AGENT_KEY_ARENA_05 }}
          HL_ACCOUNT_ADDRESS_ARENA_05: ${{ secrets.HL_ACCOUNT_ADDRESS_ARENA_05 }}
          HL_AGENT_KEY_ARENA_06: ${{ secrets.HL_AGENT_KEY_ARENA_06 }}
          HL_ACCOUNT_ADDRESS_ARENA_06: ${{ secrets.HL_ACCOUNT_ADDRESS_ARENA_06 }}
          HL_AGENT_KEY_ARENA_07: ${{ secrets.HL_AGENT_KEY_ARENA_07 }}
          HL_ACCOUNT_ADDRESS_ARENA_07: ${{ secrets.HL_ACCOUNT_ADDRESS_ARENA_07 }}
          HL_AGENT_KEY_ARENA_08: ${{ secrets.HL_AGENT_KEY_ARENA_08 }}
          HL_ACCOUNT_ADDRESS_ARENA_08: ${{ secrets.HL_ACCOUNT_ADDRESS_ARENA_08 }}
          HL_AGENT_KEY_ARENA_09: ${{ secrets.HL_AGENT_KEY_ARENA_09 }}
          HL_ACCOUNT_ADDRESS_ARENA_09: ${{ secrets.HL_ACCOUNT_ADDRESS_ARENA_09 }}
          HL_AGENT_KEY_ARENA_10: ${{ secrets.HL_AGENT_KEY_ARENA_10 }}
          HL_ACCOUNT_ADDRESS_ARENA_10: ${{ secrets.HL_ACCOUNT_ADDRESS_ARENA_10 }}
          EXECUTOR_AGENT: ${{ inputs.agent }}
        run: ${{ steps.py.outputs.bin }} scripts/with_agent_keys.py ${{ steps.py.outputs.bin }} scripts/approve.py --id "$PROPOSAL_ID" --confirm "$CONFIRM"
      - name: Push the dashboard bundle
        if: always()
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AGENT: ${{ inputs.agent }}
        run: python3 scripts/run_agents.py --push-only --only "$AGENT"
      - name: Commit state
        if: always()
        run: |
          git config user.name "aifi-runner"
          git config user.email "aifi-runner@users.noreply.github.com"
          git add -A state || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m "Approve $PROPOSAL_ID"
          for i in 1 2 3; do git pull -q --rebase --autostash || true; git push -q && exit 0; sleep 10; done; exit 1
        env:
          PROPOSAL_ID: ${{ inputs.proposal_id }}
