# Every hour at :05 UTC. scripts/run_agents.py runs each agent whose trigger bar just closed (4-hour agents at
# 00/04/08/12/16/20, 1-hour agents every hour), each in its own process holding only its own exchange key, then
# pushes that agent's dashboard. State for every agent is committed back to main in one commit.
name: cycle
on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:
    inputs:
      only:
        description: "Run only these agents (comma-separated ids); empty = every due agent"
        required: false
        type: string
        default: ""
      force:
        description: "Run even if the agent's bar did not just close"
        required: false
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: executor
  cancel-in-progress: false
jobs:
  run:
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Python (a venv with the exchange SDK only when some agent is live)
        id: py
        run: |
          if grep -lq '"mode": *"live"' config/settings.json agents/*/settings.json 2>/dev/null; then
            python3 -m venv .venv && .venv/bin/pip install --quiet -r requirements-live.txt
            echo "bin=.venv/bin/python" >> "$GITHUB_OUTPUT"
          else
            echo "every agent is in paper mode: system python3, standard library only"; echo "bin=python3" >> "$GITHUB_OUTPUT"
          fi
      - name: Run due agents
        env:
          ALL_SECRETS: ${{ toJSON(secrets) }}
          EXECUTOR_PY: ${{ steps.py.outputs.bin }}
          ONLY: ${{ inputs.only }}
          FORCE: ${{ inputs.force }}
        run: |
          ARGS=""
          [ -n "$ONLY" ] && ARGS="$ARGS --only $ONLY"
          [ "$FORCE" = "true" ] && ARGS="$ARGS --force"
          ${{ steps.py.outputs.bin }} scripts/run_agents.py $ARGS
      - name: Commit state
        if: always()
        run: |
          git config user.name "aifi-runner"
          git config user.email "aifi-runner@users.noreply.github.com"
          git add -A state || true
          if git diff --cached --quiet; then echo "no state change"; exit 0; fi
          git commit -q -m "Cycle $(date -u +%FT%H:%MZ)"
          for i in 1 2 3 4 5; do
            git pull -q --rebase --autostash || true
            git push -q && exit 0
            sleep 10
          done
          echo "could not push state"; exit 1
