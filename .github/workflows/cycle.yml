# One pass of the loop, five minutes after every 4-hour close (UTC). State is committed back to main.
name: cycle
on:
  schedule:
    - cron: "5 0,4,8,12,16,20 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: executor
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install the exchange SDK only when live mode is configured
        run: |
          if [ "$(python3 -c 'import json;print(json.load(open("config/settings.json"))["mode"])')" = "live" ]; then
            pip install --quiet hyperliquid-python-sdk==0.24.0
          else
            echo "paper mode: standard library only"
          fi
      - name: Run the cycle
        env:
          ALERT_WEBHOOK: ${{ secrets.ALERT_WEBHOOK }}
          HL_AGENT_KEY: ${{ secrets.HL_AGENT_KEY }}
          HL_ACCOUNT_ADDRESS: ${{ secrets.HL_ACCOUNT_ADDRESS }}
        run: python3 scripts/run_cycle.py
      - name: Commit state
        if: always()
        run: |
          git config user.name "aifi-runner"
          git config user.email "aifi-runner@users.noreply.github.com"
          git add -A state || true
          if git diff --cached --quiet; then echo "no state change"; exit 0; fi
          git commit -q -m "Cycle $(date -u +%FT%H:%MZ)"
          for i in 1 2 3; do
            git pull -q --rebase --autostash || true
            git push -q && exit 0
            sleep 10
          done
          echo "could not push state"; exit 1
