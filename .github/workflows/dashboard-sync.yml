# When cycles run on the owner's own server (config/host.json = alwaysdata), the server commits state but holds no
# Cloudflare token. This pushes the dashboard for exactly the agents whose state changed in that push (KV write
# budget: 1000 writes a day on the free plan). With host = github the cycle workflow pushes the dashboard itself.
# Each job writes the fleet index exec:agents exactly once (run_agents.py's fleet step, docs/COMMAND_CENTER_SPEC.md
# §6.5). A commit that only sets or clears the fleet kill switch (state/FLEET_HALT, FLEET_HALT.since) refreshes that
# index alone (--fleet-only), so a fleet halt reaches the Command Center within one sync job on either host.
name: dashboard-sync
on:
  push:
    branches: [main]
    paths: ["state/**"]
permissions:
  contents: read
concurrency:
  group: dashboard-sync
  cancel-in-progress: false
jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - name: Agents whose state changed
        id: changed
        env: { BEFORE: "${{ github.event.before }}", AFTER: "${{ github.sha }}" }
        run: |
          HOST=$(python3 -c "import json;print(json.load(open('config/host.json')).get('host','github'))")
          git cat-file -e "$BEFORE" 2>/dev/null || BEFORE="$AFTER~1"
          OUT=$(git diff --name-only "$BEFORE" "$AFTER" -- state | python3 -c "
          import sys
          ids, fleet = set(), 0
          for p in sys.stdin.read().split():
              parts = p.split('/')
              if parts[1] in ('FLEET_HALT', 'FLEET_HALT.since'):
                  fleet = 1
                  continue
              if parts[1] in ('host_beat.json', 'requests'):
                  continue
              ids.add(parts[2] if len(parts) > 3 and parts[1] == 'agents' else 'core')
          print(','.join(sorted(ids)) + ' ' + str(fleet))")
          ONLY=${OUT% *}; FLEET=${OUT##* }
          if [ "$HOST" = "github" ]; then ONLY=""; fi    # the cycle workflow pushes the agents itself
          echo "only=$ONLY" >> "$GITHUB_OUTPUT"; echo "fleet=$FLEET" >> "$GITHUB_OUTPUT"; echo "changed: $ONLY fleet: $FLEET"
      - name: Push those agents' dashboard (or only the fleet index)
        if: steps.changed.outputs.only != '' || steps.changed.outputs.fleet == '1'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ONLY: ${{ steps.changed.outputs.only }}
          FLEET: ${{ steps.changed.outputs.fleet }}
        run: if [ -n "$ONLY" ]; then python3 scripts/run_agents.py --push-only --only "$ONLY"; elif [ "$FLEET" = "1" ]; then python3 scripts/run_agents.py --fleet-only; fi
