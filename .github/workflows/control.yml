# Emergency and manual controls: flatten everything, halt new entries, or resume.
name: control
on:
  workflow_dispatch:
    inputs:
      action:
        description: "flatten closes every position and halts; halt stops new entries; resume clears the halt"
        required: true
        type: choice
        options: ["halt", "resume", "flatten"]
      reason:
        description: "Why (recorded)"
        required: false
        type: string
        default: "manual"
permissions:
  contents: write
concurrency:
  group: executor
  cancel-in-progress: false
jobs:
  control:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install the exchange SDK only when live mode is configured
        run: |
          if [ "$(python3 -c 'import json;print(json.load(open("config/settings.json"))["mode"])')" = "live" ]; then
            pip install --quiet hyperliquid-python-sdk==0.24.0
          fi
      - name: Apply
        env:
          ACTION: ${{ inputs.action }}
          REASON: ${{ inputs.reason }}
          ALERT_WEBHOOK: ${{ secrets.ALERT_WEBHOOK }}
          HL_AGENT_KEY: ${{ secrets.HL_AGENT_KEY }}
          HL_ACCOUNT_ADDRESS: ${{ secrets.HL_ACCOUNT_ADDRESS }}
        run: |
          case "$ACTION" in
            flatten) python3 scripts/control.py --flatten ;;
            halt)    python3 scripts/control.py --halt "$REASON" ;;
            resume)  python3 scripts/control.py --resume ;;
          esac
      - name: Commit state
        if: always()
        run: |
          git config user.name "aifi-runner"
          git config user.email "aifi-runner@users.noreply.github.com"
          git add -A state || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m "Control: $ACTION"
          for i in 1 2 3; do git pull -q --rebase --autostash || true; git push -q && exit 0; sleep 10; done; exit 1
        env:
          ACTION: ${{ inputs.action }}
