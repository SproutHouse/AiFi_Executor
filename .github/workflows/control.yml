# Emergency and manual controls: flatten everything, halt new entries, or resume.
name: control
on:
  workflow_dispatch:
    inputs:
      action:
        description: "flatten closes every position and halts; halt stops new entries; resume clears the halt"
        required: true
        type: choice
        options: ["halt", "resume", "flatten"]
      reason:
        description: "Why (recorded)"
        required: false
        type: string
        default: "manual"
permissions:
  contents: write
concurrency:
  group: executor
  cancel-in-progress: false
jobs:
  control:
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Python (a venv with the exchange SDK only when live mode is configured)
        id: py
        run: |
          if [ "$(python3 -c 'import json;print(json.load(open("config/settings.json"))["mode"])')" = "live" ]; then
            python3 -m venv .venv && .venv/bin/pip install --quiet -r requirements-live.txt
            echo "bin=.venv/bin/python" >> "$GITHUB_OUTPUT"
          else
            echo "bin=python3" >> "$GITHUB_OUTPUT"
          fi
      - name: Apply
        env:
          ACTION: ${{ inputs.action }}
          REASON: ${{ inputs.reason }}
          ALERT_WEBHOOK: ${{ secrets.ALERT_WEBHOOK }}
          HL_AGENT_KEY: ${{ secrets.HL_AGENT_KEY }}
          HL_ACCOUNT_ADDRESS: ${{ secrets.HL_ACCOUNT_ADDRESS }}
        run: |
          case "$ACTION" in
            flatten) ${{ steps.py.outputs.bin }} scripts/control.py --flatten ;;
            halt)    ${{ steps.py.outputs.bin }} scripts/control.py --halt "$REASON" ;;
            resume)  ${{ steps.py.outputs.bin }} scripts/control.py --resume ;;
          esac
      - name: Push the dashboard bundle
        if: always()
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then python3 scripts/dashboard_push.py; fi
      - name: Commit state
        if: always()
        run: |
          git config user.name "aifi-runner"
          git config user.email "aifi-runner@users.noreply.github.com"
          git add -A state || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m "Control: $ACTION"
          for i in 1 2 3; do git pull -q --rebase --autostash || true; git push -q && exit 0; sleep 10; done; exit 1
        env:
          ACTION: ${{ inputs.action }}
