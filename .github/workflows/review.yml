# Sunday scorecard from the ledger. Proposes; never changes a rule.
name: review
on:
  schedule:
    - cron: "0 12 * * 0"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: executor
  cancel-in-progress: false
jobs:
  review:
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Render the review
        env:
          ALERT_WEBHOOK: ${{ secrets.ALERT_WEBHOOK }}
        run: python3 scripts/review.py
      - name: Push the dashboard bundle
        if: always()
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then python3 scripts/dashboard_push.py; fi
      - name: Commit state
        if: always()
        run: |
          git config user.name "aifi-runner"
          git config user.email "aifi-runner@users.noreply.github.com"
          git add -A state || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m "Weekly review $(date -u +%F)"
          for i in 1 2 3; do git pull -q --rebase --autostash || true; git push -q && exit 0; sleep 10; done; exit 1
