# Sunday scorecard from the ledger. Proposes; never changes a rule.
name: review
on:
  schedule:
    - cron: "0 12 * * 0"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: executor
  cancel-in-progress: false
jobs:
  review:
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Render the review
        env:
          ALERT_WEBHOOK: ${{ secrets.ALERT_WEBHOOK }}
        run: |
          for a in $(python3 -c 'import sys;sys.path.insert(0,"src");from executor import common as C;print(" ".join(x["id"] for x in C.agents() if x.get("enabled",True)))'); do
            EXECUTOR_AGENT=$a python3 scripts/review.py || echo "review failed for $a"
          done
      - name: Push the dashboard bundle
        if: always()
        continue-on-error: true
        env:
          ALL_SECRETS: ${{ toJSON(secrets) }}
        run: python3 scripts/run_agents.py --push-only
      - name: Commit state
        if: always()
        run: |
          git config user.name "aifi-runner"
          git config user.email "aifi-runner@users.noreply.github.com"
          git add -A state || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m "Weekly review $(date -u +%F)"
          for i in 1 2 3; do git pull -q --rebase --autostash || true; git push -q && exit 0; sleep 10; done; exit 1
